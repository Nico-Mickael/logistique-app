services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: logistique
      POSTGRES_PASSWORD: logistique123
      POSTGRES_DB: logistique_db
      TZ: Indian/Antananarivo
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistique -d logistique_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: logistique
      DB_PASSWORD: logistique123
      DB_NAME: logistique_db
      JWT_SECRET: change_this_to_a_strong_secret_key
      PORT: 5000
      TZ: Indian/Antananarivo
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: production
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
